name: Temporary delete Jev artifacts
on:
  workflow_dispatch:
permissions:
  actions: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts and verify absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for id in 10730492013; do
            if gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" --silent 2>/dev/null; then
              gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
              echo "deleted ${id}"
            else
              echo "already absent ${id}"
            fi
            if gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" --silent 2>/dev/null; then
              echo "STILL PRESENT ${id}"; exit 1
            fi
            echo "verified absent ${id}"
          done
