name: seo-audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit 5 sites (keyed PSI, no Jev, no DataForSEO)
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -e
          for site in biddeed.ai zonewise.ai everestcapitalusa.com thepearlvacationhomes.com winnerdataai.com; do
            echo "=== auditing $site ==="
            python -m jevseo audit "https://$site" --out "audits/$site" --max-pages 30 --time-budget 300 --no-jev || echo "AUDIT FAILED: $site"
            python -m jevseo render "audits/$site" --formats xlsx,md || echo "RENDER FAILED: $site"
          done

      - name: Upload digest artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seo-audit-digests
          path: audits/
